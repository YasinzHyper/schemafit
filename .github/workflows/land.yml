name: Land daily branch

# Opt-in. Does nothing unless the repository variable AUTO_LAND is "true":
#
#   gh variable set AUTO_LAND --body true     # hands-off: green branches merge themselves
#   gh variable delete AUTO_LAND              # back to reviewing and merging by hand
#
# When enabled, a pushed daily/** or claude/** branch is checked and, if everything passes,
# rebased onto main and merged. Rebase keeps the original commit authors.
# GitHub does not let this token merge changes to .github/workflows; those always wait for a human.

on:
  push:
    branches: ["daily/**", "claude/**"]

permissions:
  contents: read

concurrency:
  group: land
  cancel-in-progress: false

jobs:
  check:
    if: vars.AUTO_LAND == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  land:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a pull request unless one already exists
        run: gh pr view "$BRANCH" --json number >/dev/null 2>&1 || gh pr create --head "$BRANCH" --base main --fill
      - name: Merge
        run: gh pr merge "$BRANCH" --rebase --delete-branch
